document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

\" stroke-linecap=\"round\"><\u002Fpath>\n          <ellipse cx=\"180\" cy=\"208\" rx=\"140\" ry=\"8\" fill=\"#ffd97a\" opacity=\".14\"><\u002Fellipse>\n        <\u002Fsvg>\n      <\u002Fdiv>\n      <div style=\"padding:18px 20px 24px;\">\n        <div style=\"display:flex; gap:8px; flex-wrap:wrap;\">\n          <span style=\"font-size:13px; font-weight:600; color:#7a1220; background:rgba(156,27,38,.1); border:1px solid rgba(156,27,38,.25); border-radius:999px; padding:4px 12px;\">{{ ev.reception.date }}<\u002Fspan>\n          <sc-if value=\"{{ ev.reception.time }}\" hint-placeholder-val=\"{{ false }}\">\n            <span style=\"font-size:13px; font-weight:600; color:#5c4a22; background:rgba(217,164,65,.16); border:1px solid rgba(217,164,65,.4); border-radius:999px; padding:4px 12px;\">{{ ev.reception.time }}<\u002Fspan>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <h3 style=\"font-family:'Rozha One', serif; font-size:27px; margin:12px 0 6px; color:#7a1220;\">Reception<\u002Fh3>\n        <p style=\"margin:0; font-size:16px; line-height:1.6; color:#5c4032; font-weight:300;\">One last night of dinner, dancing and goodbyes under the lights.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Farticle>\n\n    <!-- ===== RSVP ===== -->\n    <section data-rv=\"\" style=\"margin-top:52px; border-radius:22px; background:linear-gradient(180deg, #7a1220, #5c0d18); border:1.5px solid #d9a441; padding:28px 22px 30px; box-shadow:0 16px 40px rgba(0,0,0,.5); text-align:center;\">\n      <svg sc-camel-view-box=\"0 0 90 30\" width=\"80\" aria-hidden=\"true\" style=\"display:block; margin:0 auto;\">\n        <circle cx=\"12\" cy=\"15\" r=\"4\" fill=\"#e8842c\"><\u002Fcircle><circle cx=\"28\" cy=\"15\" r=\"4\" fill=\"#f0b13e\"><\u002Fcircle>\n        <circle cx=\"45\" cy=\"15\" r=\"5.5\" fill=\"#d9a441\"><\u002Fcircle>\n        <circle cx=\"62\" cy=\"15\" r=\"4\" fill=\"#f0b13e\"><\u002Fcircle><circle cx=\"78\" cy=\"15\" r=\"4\" fill=\"#e8842c\"><\u002Fcircle>\n      <\u002Fsvg>\n      <h2 style=\"font-family:'Rozha One', serif; font-size:32px; margin:12px 0 6px; color:#f7ead7;\">Will you join us?<\u002Fh2>\n      <p style=\"margin:0 auto 22px; max-width:330px; font-size:15px; line-height:1.65; color:#e3c496; font-weight:300;\">Some people make every celebration brighter just by being in it — for us, that's you. Our story wouldn't feel complete without you there as it becomes one. One tap is all it takes — we'll handle the rest.<\u002Fp>\n\n      <sc-if value=\"{{ showForm }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex; flex-direction:column; gap:16px; text-align:left;\">\n          <label style=\"display:flex; flex-direction:column; gap:6px;\">\n            <span style=\"font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:#e3c496; font-weight:600;\">Your name<\u002Fspan>\n            <input type=\"text\" value=\"{{ rsvpName }}\" sc-camel-on-change=\"{{ onName }}\" autocomplete=\"name\" style=\"min-height:52px; font-size:17px; padding:0 16px; border-radius:14px; border:1.5px solid rgba(217,164,65,.6); background:#f9efdd; color:#3a1210; outline:none; width:100%; box-sizing:border-box;\">\n          <\u002Flabel>\n          <sc-for list=\"{{ extraGuests }}\" as=\"g\" hint-placeholder-count=\"1\">\n            <label style=\"display:flex; flex-direction:column; gap:6px;\">\n              <span style=\"font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:#e3c496; font-weight:600;\">{{ g.label }}<\u002Fspan>\n              <input type=\"text\" value=\"{{ g.value }}\" sc-camel-on-change=\"{{ g.onChange }}\" style=\"min-height:52px; font-size:17px; padding:0 16px; border-radius:14px; border:1.5px solid rgba(217,164,65,.6); background:#f9efdd; color:#3a1210; outline:none; width:100%; box-sizing:border-box;\">\n            <\u002Flabel>\n          <\u002Fsc-for>\n          <div style=\"display:flex; flex-direction:column; gap:6px;\">\n            <span style=\"font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:#e3c496; font-weight:600;\">Guests (including you)<\u002Fspan>\n            <div style=\"display:flex; align-items:center; gap:14px;\">\n              <button sc-camel-on-click=\"{{ guestMinus }}\" aria-label=\"Fewer guests\" style=\"width:52px; height:52px; border-radius:14px; border:1.5px solid rgba(217,164,65,.6); background:rgba(249,239,221,.1); color:#f0b13e; font-size:26px; font-weight:600; cursor:pointer; line-height:1;\">−<\u002Fbutton>\n              <span style=\"font-family:'Rozha One', serif; font-size:30px; color:#f7ead7; min-width:44px; text-align:center;\">{{ guests }}<\u002Fspan>\n              <button sc-camel-on-click=\"{{ guestPlus }}\" aria-label=\"More guests\" style=\"width:52px; height:52px; border-radius:14px; border:1.5px solid rgba(217,164,65,.6); background:rgba(249,239,221,.1); color:#f0b13e; font-size:26px; font-weight:600; cursor:pointer; line-height:1;\">+<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ rsvpErr }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"margin:0; font-size:15px; color:#ffb4a8; font-weight:500;\">{{ rsvpErr }}<\u002Fp>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ notDeclining }}\" hint-placeholder-val=\"{{ true }}\">\n            <button sc-camel-on-click=\"{{ accept }}\" style=\"min-height:56px; border-radius:999px; border:none; background:linear-gradient(180deg, #e8a13e, #d9822c); color:#3a1210; font-family:'Mukta', sans-serif; font-size:18px; font-weight:700; letter-spacing:.02em; cursor:pointer; box-shadow:0 8px 22px rgba(232,132,44,.4); margin-top:4px; width:100%;\">{{ acceptLabel }}<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ startDecline }}\" style=\"min-height:44px; border:none; background:none; color:#e3c496; font-family:'Mukta', sans-serif; font-size:15px; font-weight:400; text-decoration:underline; text-underline-offset:3px; cursor:pointer; width:100%;\">Sorry, I can't make it<\u002Fbutton>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ declining }}\" hint-placeholder-val=\"{{ false }}\">\n            <label style=\"display:flex; flex-direction:column; gap:6px;\">\n              <span style=\"font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:#e3c496; font-weight:600;\">A message for Yash &amp; Muskan (optional)<\u002Fspan>\n              <textarea value=\"{{ message }}\" sc-camel-on-change=\"{{ onMessage }}\" rows=\"4\" style=\"font-size:17px; padding:12px 16px; border-radius:14px; border:1.5px solid rgba(217,164,65,.6); background:#f9efdd; color:#3a1210; outline:none; width:100%; box-sizing:border-box; resize:vertical; min-height:100px;\"><\u002Ftextarea>\n            <\u002Flabel>\n            <button sc-camel-on-click=\"{{ decline }}\" style=\"min-height:56px; border-radius:999px; border:1.5px solid #d9a441; background:rgba(217,164,65,.1); color:#ecc989; font-family:'Mukta', sans-serif; font-size:17px; font-weight:600; cursor:pointer; margin-top:4px; width:100%;\">{{ declineLabel }}<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ cancelDecline }}\" style=\"min-height:44px; border:none; background:none; color:#e3c496; font-family:'Mukta', sans-serif; font-size:15px; font-weight:400; text-decoration:underline; text-underline-offset:3px; cursor:pointer; width:100%;\">Back — I might make it after all<\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ showDoneYes }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding:10px 0 4px;\">\n          <svg sc-camel-view-box=\"0 0 60 60\" width=\"56\" aria-hidden=\"true\" style=\"display:block; margin:0 auto 10px;\">\n            <circle cx=\"30\" cy=\"30\" r=\"27\" fill=\"none\" stroke=\"#f0b13e\" stroke-width=\"3\"><\u002Fcircle>\n            <path d=\"M18 31 L27 40 L43 22\" fill=\"none\" stroke=\"#f0b13e\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath>\n          <\u002Fsvg>\n          <p style=\"margin:0; font-family:'Rozha One', serif; font-size:24px; color:#f7ead7;\">See you in Dhari!<\u002Fp>\n          <p style=\"margin:8px 0 0; font-size:15px; color:#e3c496; font-weight:300;\">{{ doneMsg }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ showDoneNo }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding:10px 0 4px;\">\n          <p style=\"margin:0; font-family:'Rozha One', serif; font-size:24px; color:#f7ead7;\">You'll be missed<\u002Fp>\n          <p style=\"margin:8px 0 0; font-size:15px; color:#e3c496; font-weight:300;\">Thank you for letting us know — we'll raise a glass for you. {{ doneMsg }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fsection>\n\n    <!-- ===== DIRECTIONS / FOOTER ===== -->\n    <footer data-rv=\"\" style=\"margin-top:44px; text-align:center; padding-bottom:20px;\">\n      <h2 style=\"font-family:'Rozha One', serif; font-size:26px; margin:0 0 8px; color:#f7ead7;\">Getting there<\u002Fh2>\n      <p style=\"margin:0 auto; max-width:320px; font-size:16px; line-height:1.6; color:#d8b98f; font-weight:300;\">Every celebration takes place in and around <strong style=\"font-weight:600; color:#f0b13e;\">Dhari, Gujarat, India<\u002Fstrong>. Exact venues will follow closer to the day.<\u002Fp>\n      <a href=\"{{ mapsUrl }}\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex; align-items:center; justify-content:center; gap:10px; margin-top:18px; min-height:50px; padding:0 26px; border-radius:999px; border:1.5px solid #d9a441; color:#ecc989; font-weight:600; font-size:16px; text-decoration:none; background:rgba(217,164,65,.08);\">\n        <svg sc-camel-view-box=\"0 0 20 20\" width=\"18\" height=\"18\" aria-hidden=\"true\"><path d=\"M10 2 C6.7 2 4 4.7 4 8 C4 12.5 10 18 10 18 C10 18 16 12.5 16 8 C16 4.7 13.3 2 10 2 Z\" fill=\"none\" stroke=\"#ecc989\" stroke-width=\"1.8\"><\u002Fpath><circle cx=\"10\" cy=\"8\" r=\"2.4\" fill=\"none\" stroke=\"#ecc989\" stroke-width=\"1.8\"><\u002Fcircle><\u002Fsvg>\n        Open in Google Maps\n      <\u002Fa>\n      <div style=\"margin-top:40px; display:flex; align-items:center; justify-content:center; gap:14px;\">\n        <div style=\"height:1px; width:60px; background:linear-gradient(90deg, transparent, #d9a441);\"><\u002Fdiv>\n        <span style=\"font-family:'Rozha One', serif; font-size:20px; color:#e8c176;\">MY<\u002Fspan>\n        <div style=\"height:1px; width:60px; background:linear-gradient(270deg, transparent, #d9a441);\"><\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:14px 0 0; font-size:14px; color:#c9a97e; font-weight:300;\">With all our love and warmest wishes,<\u002Fp>\n      <p style=\"margin:8px 0 0; font-size:15px; color:#e8c176; font-weight:500; line-height:1.8;\">Natwarlal Kacha<br>Bhavanaben Kacha<br>Ankita and Chintan Gurjar<\u002Fp>\n      <p style=\"margin:12px 0 0; font-size:14px; color:#e8c176; font-weight:500;\">#ForeverMY<\u002Fp>\n    <\u002Ffooter>\n  <\u002Fmain>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;petals&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Atmosphere&quot;},&quot;rsvpEndpoint&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;RSVP&quot;},&quot;guestFallback&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;friends&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Copy&quot;}}\">\nconst CONFIG = {\n  couple: { groom: 'Yash', bride: 'Muskan', monogram: 'MY', hashtag: '#ForeverMY' },\n  location: {\n    name: 'Dhari, Gujarat, India',\n    mapsUrl: 'https://www.google.com/maps/search/?api=1&query=Dhari%2C+Gujarat%2C+India'\n  },\n  countdownTarget: '2027-01-26T00:00:00+05:30',\n  calendarUrl: 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=Yash%20%26%20Muskan%27s%20Wedding&dates=20270123/20270127&location=Dhari%2C%20Gujarat%2C%20India&details=%23ForeverMY',\n  rsvpEndpoint: '',   // POST {name, attending, guestCount, guestNames, message, to} as JSON; empty = demo mode\n  events: {           // leave time '' to hide the time chip\n    mehndi:    { date: 'Sat 23 Jan 2027', time: '' },\n    mandap:    { date: 'Sun 24 Jan 2027', time: '' },\n    pithi:     { date: 'Mon 25 Jan 2027', time: '' },\n    garba:     { date: 'Mon 25 Jan 2027', time: '' },\n    wedding:   { date: 'Tue 26 Jan 2027', time: '' },\n    reception: { date: 'Tue 26 Jan 2027', time: '' }\n  }\n};\n\nclass Component extends DCLogic {\n  state = { name: '', guests: 1, extraNames: [], stage: 'form', declining: false, message: '', err: '', toParam: '', guestName: '', cd: { d: '—', h: '—', m: '—', s: '—' } };\n\n  sanitize(s) {\n    return String(s || '').replace(/[^\\p{L}\\p{M} '’.\\-]/gu, '').slice(0, 40).trim();\n  }\n\n  tick() {\n    const diff = new Date(CONFIG.countdownTarget) - Date.now();\n    if (diff <= 0) { this.setState({ cd: { d: '0', h: '0', m: '0', s: '0' } }); return; }\n    const d = Math.floor(diff / 864e5), h = Math.floor(diff / 36e5) % 24,\n          m = Math.floor(diff / 6e4) % 60, s = Math.floor(diff / 1e3) % 60;\n    this.setState({ cd: { d: String(d), h: String(h).padStart(2, '0'), m: String(m).padStart(2, '0'), s: String(s).padStart(2, '0') } });\n  }\n\n  componentDidMount() {\n    this.tick();\n    this._timer = setInterval(() => this.tick(), 1000);\n    try {\n      const raw = new URLSearchParams(window.location.search).get('to');\n      const clean = this.sanitize(raw);\n      if (clean) this.setState({ toParam: clean, guestName: clean, name: clean });\n    } catch (e) {}\n    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {\n      const els = Array.from(document.querySelectorAll('[data-rv]'));\n      els.forEach(el => { el.style.opacity = '0'; el.style.transform = 'translateY(26px)'; el.style.transition = 'opacity .8s ease, transform .8s ease'; });\n      this._io = new IntersectionObserver(entries => entries.forEach(e => {\n        if (e.isIntersecting) { e.target.style.opacity = '1'; e.target.style.transform = 'none'; this._io.unobserve(e.target); }\n      }), { threshold: 0.1 });\n      els.forEach(el => this._io.observe(el));\n    }\n  }\n\n  componentWillUnmount() {\n    clearInterval(this._timer);\n    if (this._io) this._io.disconnect();\n  }\n\n  setGuests(n) {\n    this.setState(s => {\n      const g = Math.max(1, Math.min(12, n));\n      const arr = s.extraNames.slice(0, g - 1);\n      while (arr.length < g - 1) arr.push('');\n      return { guests: g, extraNames: arr };\n    });\n  }\n\n  async send(attending) {\n    const name = this.sanitize(this.state.name);\n    if (!name) { this.setState({ err: 'Please tell us your name first.' }); return; }\n    if (attending) {\n      const missing = this.state.extraNames.some(n => !this.sanitize(n));\n      if (missing) { this.setState({ err: 'Please add a name for each guest.' }); return; }\n    }\n    const endpoint = (this.props.rsvpEndpoint ?? CONFIG.rsvpEndpoint) || '';\n    const guestNames = attending ? [name, ...this.state.extraNames.map(n => this.sanitize(n))] : [name];\n    const payload = {\n      name, attending,\n      guestCount: attending ? this.state.guests : 0,\n      guestNames,\n      message: String(this.state.message || '').slice(0, 600).trim(),\n      to: this.state.toParam\n    };\n    this.setState({ stage: 'sending', err: '' });\n    if (!endpoint) {\n      setTimeout(() => this.setState({ stage: attending ? 'done-yes' : 'done-no', demo: true }), 700);\n      return;\n    }\n    try {\n      const res = await fetch(endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });\n      if (!res.ok) throw new Error('bad status');\n      this.setState({ stage: attending ? 'done-yes' : 'done-no', demo: false });\n    } catch (e) {\n      this.setState({ stage: 'form', err: 'Something went wrong sending your RSVP — please try again.' });\n    }\n  }\n\n  renderVals() {\n    const st = this.state;\n    const fallback = this.props.guestFallback ?? 'friends';\n    const extraGuests = st.extraNames.map((val, i) => ({\n      label: 'Guest ' + (i + 2) + ' name',\n      value: val,\n      onChange: (e) => {\n        const v = e.target.value;\n        this.setState(s => { const arr = s.extraNames.slice(); arr[i] = v; return { extraNames: arr, err: '' }; });\n      }\n    }));\n    return {\n      showPetals: this.props.petals ?? true,\n      guestName: st.guestName || fallback,\n      cdD: st.cd.d, cdH: st.cd.h, cdM: st.cd.m, cdS: st.cd.s,\n      calendarUrl: CONFIG.calendarUrl,\n      mapsUrl: CONFIG.location.mapsUrl,\n      ev: CONFIG.events,\n      rsvpName: st.name,\n      onName: (e) => this.setState({ name: e.target.value, err: '' }),\n      guests: st.guests,\n      extraGuests,\n      guestMinus: () => this.setGuests(st.guests - 1),\n      guestPlus: () => this.setGuests(st.guests + 1),\n      rsvpErr: st.err,\n      accept: () => this.send(true),\n      decline: () => this.send(false),\n      startDecline: () => this.setState({ declining: true, err: '' }),\n      cancelDecline: () => this.setState({ declining: false, message: '', err: '' }),\n      onMessage: (e) => this.setState({ message: e.target.value }),\n      message: st.message,\n      acceptLabel: st.stage === 'sending' ? 'Sending…' : 'Joyfully accept',\n      declineLabel: st.stage === 'sending' ? 'Sending…' : 'Send with love',\n      notDeclining: !st.declining,\n      declining: st.declining,\n      showForm: st.stage === 'form' || st.stage === 'sending',\n      showDoneYes: st.stage === 'done-yes',\n      showDoneNo: st.stage === 'done-no',\n      doneMsg: st.demo ? '(Demo mode — no RSVP endpoint is set yet, so nothing was sent.)' : 'Your RSVP has been sent.'\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
